<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Интервал — киберграмотность без тумана</title>
    <meta name="description" content="Демонстрационная учебная платформа по цифровой безопасности: курсы, проверка знаний и практические материалы." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="interval-fixes.css" />
    <script>
      try {
        var s = localStorage.getItem("interval-theme");
        var d = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="interval-root"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
